# cargo-about: third-party notices for the adage binary (plan §7 L2). Generate with
# scripts/notice.sh. Keep `accepted` in step with deny.toml's [licenses] allow list.
accepted = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Only what ships in the binary.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Adage's own crates (Apache-2.0, not published to crates.io) are not third-party.
private = { ignore = true }
