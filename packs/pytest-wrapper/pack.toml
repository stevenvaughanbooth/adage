format = "adage-pack/1"

[pack]
name = "adage/pytest-wrapper"
version = "0.1.0"
origin = "instinct"
description = "Run pytest the way the repository does. When pytest, in any spelling, fails for want of the environment a Makefile wrapper sets, or outside tox's test environment, Adage names make test or tox -e py."

[applicability]
kind = "detector"
detector = "P1"
catalogue = "core@0.1.0"

[requires]
templates = ["after@1"]

[exec]
requested = "E0"

[provenance]
tool = "adage 0.1.0"

[provenance.origins]
organic = 0
synthetic = 0
declared = 0
instinct = 0
imported = 0
