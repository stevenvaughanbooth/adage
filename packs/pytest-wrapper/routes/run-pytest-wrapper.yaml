id: run-pytest-wrapper
summary: After pytest fails for want of its wrapper or tox environment, run the declared wrapper
shape: after
detector: P1
trigger:
  on: after_failure
  command: '{runner}'
  signature: '{signature}'
steps:
- id: run
  run:
    argv:
    - '{command}'
  effect: verify
strength: prime
exit:
- when: intent_changes
