format = "adage-pack/1"

[pack]
name = "adage/generated-files"
version = "0.1.0"
origin = "instinct"
description = "Do not hand-edit generated files. When an edit touches a file its header marks as generated, or one a declared generator writes, Adage says to change its inputs and regenerate it."

[applicability]
kind = "detector"
detector = "U4"
catalogue = "core@0.1.0"

[requires]
templates = [
    "advise:generated-file@1",
    "advise@1",
]

[exec]
requested = "E0"

[provenance]
tool = "adage 0.1.0"

[provenance.origins]
organic = 0
synthetic = 0
declared = 0
instinct = 0
imported = 0
