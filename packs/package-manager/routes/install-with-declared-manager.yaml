id: install-with-declared-manager
summary: After the wrong package manager refuses to install, install with the declared one
shape: after
detector: N1
trigger:
  on: after_failure
  command: '{runner}'
  signature: '{signature}'
steps:
- id: run
  run:
    argv:
    - '{command}'
  effect: environment
strength: prime
exit:
- when: intent_changes
