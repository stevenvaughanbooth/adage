format = "adage-pack/1"

[pack]
name = "adage/test-command"
version = "0.1.0"
origin = "instinct"
description = "Use the repository's one declared test command. When an undeclared test runner fails in a way that says it was the wrong way in, Adage names the test command the repository declares (make test, npm test, tox -e py and the like)."

[applicability]
kind = "detector"
detector = "U3"
catalogue = "core@0.1.0"

[requires]
templates = ["after@1"]

[exec]
requested = "E0"

[provenance]
tool = "adage 0.1.0"

[provenance.origins]
organic = 0
synthetic = 0
declared = 0
instinct = 0
imported = 0
