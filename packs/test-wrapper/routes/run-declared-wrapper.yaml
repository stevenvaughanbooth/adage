id: run-declared-wrapper
summary: After a test runner fails for want of what the declared test wrapper sets, run the wrapper
shape: after
detector: U1
trigger:
  on: after_failure
  command: '{runner}'
  signature: '{signature}'
steps:
- id: run
  run:
    argv:
    - '{command}'
  effect: verify
strength: prime
exit:
- when: intent_changes
