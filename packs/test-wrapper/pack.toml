format = "adage-pack/1"

[pack]
name = "adage/test-wrapper"
version = "0.1.0"
origin = "instinct"
description = "Use the repository's own test wrapper. When a test runner fails because it ran without what the repository's Makefile target or package.json script gives it (an environment variable, a loader), Adage names that wrapper, as the repository's files declare it."

[applicability]
kind = "detector"
detector = "U1"
catalogue = "core@0.1.0"

[requires]
templates = ["after@1"]

[exec]
requested = "E0"

[provenance]
tool = "adage 0.1.0"

[provenance.origins]
organic = 0
synthetic = 0
declared = 0
instinct = 0
imported = 0
