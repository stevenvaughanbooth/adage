id: run-tests-in-project-env
summary: After pytest fails outside the project's environment, run it inside the environment
shape: after
detector: U11
trigger:
  on: after_failure
  command: '{runner}'
  signature: '{signature}'
steps:
- id: run
  run:
    argv:
    - '{command}'
  effect: verify
strength: prime
exit:
- when: intent_changes
