<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adage Proving Run</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14171f; --muted: #667085; --line: #e4e7ec; --soft: #f1f3f6;
  --holdout: #8a94a6; --adage: #2f6fed; --good: #12a150; --bad: #d92d20; --gold: #e0a100;
  --c-explore: #b8c0cc; --c-lookup: #2f6fed; --c-edit: #7c4dff; --c-verify: #12a150; --c-verify-fail: #d92d20;
  --c-regen: #0fa3a3; --c-exec: #667085; --c-other: #d0d5dd;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1117; --panel: #161b24; --ink: #e8ebf0; --muted: #98a2b3; --line: #262d3a; --soft: #1c2230;
    --holdout: #7b8698; --adage: #5b8cff; --c-explore: #4a5363; --c-other: #3a4250; --c-exec: #8a94a6;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1117; --panel: #161b24; --ink: #e8ebf0; --muted: #98a2b3; --line: #262d3a; --soft: #1c2230;
  --holdout: #7b8698; --adage: #5b8cff; --c-explore: #4a5363; --c-other: #3a4250; --c-exec: #8a94a6;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px 16px 48px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; margin-bottom: 18px; }
h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
h1 span { color: var(--muted); font-weight: 500; }
.sub { color: var(--muted); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); font-size: 12px; font-weight: 600; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.pill.live .dot { animation: pulse 1.2s infinite; background: var(--good); }
@keyframes pulse { 50% { opacity: .3; } }
.grid { display: grid; gap: 14px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); margin-bottom: 14px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 10px; font-weight: 700; }
.kpi .label { color: var(--muted); font-size: 12px; font-weight: 600; }
.kpi .row { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; }
.kpi .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; }
.kpi .v.adage { color: var(--adage); }
.kpi .v.holdout { color: var(--holdout); font-size: 18px; }
.kpi .delta { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 6px; }
.delta.good { background: color-mix(in srgb, var(--good) 15%, transparent); color: var(--good); }
.delta.bad { background: color-mix(in srgb, var(--bad) 15%, transparent); color: var(--bad); }
.kpi .n { color: var(--muted); font-size: 11px; margin-top: 4px; }
.two { grid-template-columns: 1.55fr 1fr; }
@media (max-width: 960px) { .two { grid-template-columns: 1fr; } }
.lanes { display: flex; flex-direction: column; gap: 4px; }
.lane { display: grid; grid-template-columns: 150px 1fr 74px; align-items: center; gap: 10px; min-height: 26px; }
.lane .name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lane .name b { font-weight: 700; }
.tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 5px; margin-left: 6px; }
.tag.adage { background: color-mix(in srgb, var(--adage) 16%, transparent); color: var(--adage); }
.tag.holdout { background: color-mix(in srgb, var(--holdout) 18%, transparent); color: var(--holdout); }
.tag.train { background: var(--soft); color: var(--muted); }
.track { position: relative; height: 22px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.tick { position: absolute; top: 4px; width: 7px; height: 14px; border-radius: 2px; }
.fe { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--c-edit); opacity: .55; }
.dir { position: absolute; top: 2px; width: 10px; height: 10px; transform: rotate(45deg); background: var(--gold); border: 1px solid color-mix(in srgb, var(--gold) 50%, black); }
.now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink); opacity: .25; }
.status { font-size: 12px; font-weight: 700; text-align: right; }
.status.passed { color: var(--good); } .status.failed { color: var(--bad); } .status.running { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px 14px; font-size: 12px; color: var(--muted); margin: 6px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.group { margin: 10px 0 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.route { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.route .top { display: flex; align-items: center; gap: 8px; font-weight: 700; }
.aspect { width: 11px; height: 11px; border-radius: 50%; flex: none; }
.aspect.green { background: var(--good); } .aspect.yellow { background: var(--gold); } .aspect.red { background: var(--bad); }
.route code { display: block; margin-top: 6px; font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--soft); padding: 6px 8px; border-radius: 6px; white-space: pre-wrap; word-break: break-word; }
.route .ev { color: var(--muted); font-size: 12px; margin-top: 6px; }
.feed .item { border-left: 3px solid var(--gold); padding: 6px 10px; margin-bottom: 8px; background: var(--soft); border-radius: 0 8px 8px 0; font-size: 12px; }
.feed .item.red { border-color: var(--bad); } .feed .item.green { border-color: var(--good); } .feed .item.stop { border-color: var(--c-regen); }
.feed .meta { color: var(--muted); font-size: 11px; margin-bottom: 3px; }
.feed pre { margin: 0; white-space: pre-wrap; font: 11.5px/1.4 ui-monospace, Menlo, monospace; }
.chart svg { width: 100%; height: auto; display: block; }
.axis text { fill: var(--muted); font-size: 11px; }
.empty { color: var(--muted); font-style: italic; padding: 8px 0; }
.foot { margin-top: 16px; color: var(--muted); font-size: 12px; }
.toggle { margin-left: auto; cursor: pointer; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 8px; padding: 3px 9px; font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Adage <span>· live proving run</span></h1>
    <span id="phase" class="pill"><span class="dot"></span><span>idle</span></span>
    <span class="sub" id="meta"></span>
    <button class="toggle" id="theme">theme</button>
  </header>

  <div class="grid kpis" id="kpis"></div>

  <div class="grid two">
    <section class="panel">
      <h2>Agents, live — every tick is a tool call</h2>
      <div class="legend">
        <span><i style="background:var(--c-explore)"></i>exploring</span>
        <span><i style="background:var(--c-lookup)"></i>work-item lookup</span>
        <span><i style="background:var(--c-edit)"></i>edit</span>
        <span><i style="background:var(--c-verify)"></i>tests pass</span>
        <span><i style="background:var(--c-verify-fail)"></i>dead end</span>
        <span><i style="background:var(--c-regen)"></i>make gen</span>
        <span><i style="background:var(--gold);transform:rotate(45deg)"></i>Adage directive</span>
      </div>
      <div id="lanes" class="lanes"></div>
    </section>
    <div class="grid" style="align-content:start">
      <section class="panel chart"><h2>Turns before the first edit, per work item</h2><div id="chart"></div></section>
      <section class="panel"><h2>Tracks Adage learned</h2><div id="tracks"></div></section>
      <section class="panel feed"><h2>Directives</h2><div id="feed"></div></section>
    </div>
  </div>
  <div class="foot" id="foot"></div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const median = (a) => { const v = a.filter((x) => x != null).sort((x, y) => x - y); if (!v.length) return null; const m = Math.floor(v.length / 2); return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2; };
const mean = (a) => { const v = a.filter((x) => x != null); return v.length ? v.reduce((s, x) => s + x, 0) / v.length : null; };
const fmt = (x, d = 1) => (x == null ? "–" : Number(x).toFixed(d));

try { const t = localStorage.getItem("adage-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("adage-theme", next); } catch (e) {}
};

function kpis(runs) {
  const done = runs.filter((r) => r.phase === "eval" && r.metrics);
  const arm = (a) => done.filter((r) => r.arm === a).map((r) => r.metrics);
  const H = arm("holdout"), A = arm("adage");
  const tiles = [
    ["Turns before first edit", "median", (m) => m.turns_to_first_edit, median, 1, true],
    ["Seconds to first edit", "median", (m) => m.time_to_first_edit, median, 0, true],
    ["Exploration calls before edit", "median", (m) => m.explore_calls_before_edit, median, 1, true],
    ["Tasks passing hidden check", "rate", (m) => (m.passed ? 1 : 0), mean, 0, false, true],
    ["Dead-end hits per run", "mean", (m) => m.dead_end_hits, mean, 2, true],
    ["Cost per run (USD)", "mean", (m) => m.cost_usd, mean, 3, true],
  ];
  $("kpis").innerHTML = tiles.map(([label, agg, f, fn, d, lowerBetter, pct]) => {
    const h = fn(H.map(f)), a = fn(A.map(f));
    let delta = "";
    if (h != null && a != null && h !== 0) {
      const ch = pct ? (a - h) * 100 : ((a - h) / Math.abs(h)) * 100;
      const good = lowerBetter ? ch < 0 : ch > 0;
      delta = `<span class="delta ${good ? "good" : ch === 0 ? "" : "bad"}">${ch > 0 ? "+" : ""}${ch.toFixed(0)}${pct ? " pts" : "%"}</span>`;
    }
    const show = (x) => (x == null ? "–" : pct ? `${Math.round(x * 100)}%` : fmt(x, d));
    return `<div class="panel kpi"><div class="label">${label}</div>
      <div class="row"><span class="v adage">${show(a)}</span><span class="v holdout">${show(h)}</span>${delta}</div>
      <div class="n">Adage vs without · ${A.length} + ${H.length} runs · ${agg}</div></div>`;
  }).join("");
}

function lanes(runs) {
  const now = Date.now() / 1000;
  const order = (r) => (r.phase === "train" ? 0 : 1);
  const sorted = [...runs].sort((a, b) => order(a) - order(b) || String(a.task).localeCompare(String(b.task)) || String(a.id).localeCompare(String(b.id)));
  const span = Math.max(60, ...runs.map((r) => (r.metrics ? r.metrics.elapsed : now - (r.t0 || now))));
  let html = "", group = "";
  for (const r of sorted) {
    const g = r.phase === "train" ? "Training — agents without Adage (Adage learns from these)" : `Held-out work item ${r.task}`;
    if (g !== group) { html += `<div class="group">${esc(g)}</div>`; group = g; }
    const x = (t) => `${Math.min(99.2, (t / span) * 100)}%`;
    const ticks = (r.events || []).map((e) => `<div class="tick" title="${esc(e.tool)}: ${esc(e.cmd)}" style="left:${x(e.t)};background:var(--c-${e.cat})"></div>`).join("");
    const fe = r.metrics && r.metrics.time_to_first_edit != null ? `<div class="fe" style="left:${x(r.metrics.time_to_first_edit)}"></div>` : "";
    const dirs = (r.directives || []).map((d) => `<div class="dir" style="left:${x(d.t)}" title="Adage directive"></div>`).join("");
    const nowLine = r.status === "running" ? `<div class="now" style="left:${x(now - r.t0)}"></div>` : "";
    const st = r.status === "running" ? `${Math.round(now - r.t0)}s…` : r.status === "passed" ? `✓ ${Math.round(r.metrics.elapsed)}s` : `✗ ${r.metrics ? Math.round(r.metrics.elapsed) + "s" : ""}`;
    const arm = r.arm === "train" ? "train" : r.arm;
    html += `<div class="lane"><div class="name"><b>${esc(r.task)}</b><span class="tag ${arm}">${arm === "adage" ? "Adage" : arm === "holdout" ? "without" : "train"}</span></div>
      <div class="track">${fe}${ticks}${dirs}${nowLine}</div><div class="status ${esc(r.status)}">${st}</div></div>`;
  }
  $("lanes").innerHTML = html || `<div class="empty">Waiting for the first agent…</div>`;
}

function chart(runs) {
  const done = runs.filter((r) => r.phase === "eval" && r.metrics);
  const tasks = [...new Set(done.map((r) => r.task))].sort();
  if (!tasks.length) { $("chart").innerHTML = `<div class="empty">Appears as held-out runs finish.</div>`; return; }
  const W = 460, rowH = 34, H = tasks.length * rowH + 30, L = 64;
  const vals = (t, a) => done.filter((r) => r.task === t && r.arm === a).map((r) => r.metrics.turns_to_first_edit).filter((v) => v != null);
  const max = Math.max(4, ...done.map((r) => r.metrics.turns_to_first_edit || 0));
  const sx = (v) => L + (v / max) * (W - L - 16);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Turns before first edit per task">`;
  for (let i = 0; i <= max; i += Math.max(1, Math.ceil(max / 6))) s += `<g class="axis"><line x1="${sx(i)}" x2="${sx(i)}" y1="4" y2="${H - 22}" stroke="var(--line)"/><text x="${sx(i)}" y="${H - 6}" text-anchor="middle">${i}</text></g>`;
  tasks.forEach((t, i) => {
    const y = 10 + i * rowH;
    s += `<text x="0" y="${y + 13}" class="axis" style="fill:var(--ink);font-size:12px;font-weight:600">${esc(t)}</text>`;
    [["holdout", 4], ["adage", 16]].forEach(([a, dy]) => {
      const v = vals(t, a), m = median(v);
      if (m != null) s += `<rect x="${L}" y="${y + dy}" width="${Math.max(1, sx(m) - L)}" height="9" rx="3" fill="var(--${a})" opacity=".85"/>`;
      v.forEach((x) => { s += `<circle cx="${sx(x)}" cy="${y + dy + 4.5}" r="3" fill="var(--panel)" stroke="var(--${a})" stroke-width="1.5"/>`; });
    });
  });
  s += `</svg><div class="legend"><span><i style="background:var(--holdout)"></i>without Adage</span><span><i style="background:var(--adage)"></i>with Adage</span><span>bars = median · circles = runs</span></div>`;
  $("chart").innerHTML = s;
}

function tracks(state) {
  const routes = state.tracks || [];
  if (!routes.length) { $("tracks").innerHTML = `<div class="empty">Nothing learned yet — Adage learns after the training runs.</div>`; return; }
  $("tracks").innerHTML = routes.map((ir) => {
    const r = ir.route, e = r.evidence || {};
    const step = r.step.do === "run" ? r.step.command : r.step.do === "read_batch" ? `read linked files together (from "${r.slots?.[0]?.source?.field}")` : `avoid: ${r.step.avoid}\ninstead: ${r.step.instead}`;
    const trig = { prompt: "prompt names a work item", after_command: "after the lookup succeeds", after_edit: `after editing ${r.trigger.paths}`, session_start: "at session start", after_failure: "after a failure" }[r.trigger.on] || r.trigger.on;
    return `<div class="route"><div class="top"><span class="aspect ${r.aspect}"></span>${esc(ir.track.split("/").pop())} · ${esc(r.id)}</div>
      <div class="ev">when ${esc(trig)}</div><code>${esc(step)}</code>
      <div class="ev">${e.support}/${e.opportunities} sessions · rate ${fmt(e.rate, 2)} · Wilson lb ${fmt(e.lower_bound, 2)} · ${esc(r.effect)}</div></div>`;
  }).join("");
}

function feed(runs) {
  const items = [];
  for (const r of runs) for (const d of (r.metrics?.adage || [])) if (d.kind === "directives" || d.kind === "stop_request") items.push({ r, d });
  items.sort((a, b) => (b.d.ts || 0) - (a.d.ts || 0));
  $("feed").innerHTML = items.slice(0, 8).map(({ r, d }) => {
    const cls = d.kind === "stop_request" ? "stop" : d.aspect;
    const title = d.kind === "stop_request" ? "finish-line check at Stop" : `${d.aspect} · ${d.route}`;
    return `<div class="item ${cls}"><div class="meta">${esc(r.task)} · ${esc(d.event)} · ${esc(title)}</div><pre>${esc(d.text)}</pre></div>`;
  }).join("") || `<div class="empty">Directives appear here as Adage emits them.</div>`;
}

async function tick() {
  try {
    const s = await (await fetch("state.json", { cache: "no-store" })).json();
    const runs = Object.values(s.runs || {});
    const running = runs.filter((r) => r.status === "running").length;
    const ph = $("phase");
    ph.className = "pill" + (running ? " live" : "");
    ph.lastElementChild.textContent = { train: "training", learn: "learning", eval: "evaluating", done: "complete", smoke: "smoke test" }[s.phase] || s.phase;
    const ev = runs.filter((r) => r.phase === "eval");
    $("meta").textContent = `${s.model || ""} · ${runs.filter((r) => r.phase === "train").length} training runs · ${ev.filter((r) => r.metrics).length}/${ev.length} held-out runs done · ${running} running`;
    kpis(runs); lanes(runs); chart(runs); tracks(s); feed(runs);
    const L = s.learn;
    $("foot").textContent = L ? `Learned from ${L.sessions_used} real sessions · index ${L.index_generation} · thresholds ${L.thresholds} (demo scale)` : "";
  } catch (e) { /* keep last frame */ }
}
tick(); setInterval(tick, 1500);
</script>
</body>
</html>
