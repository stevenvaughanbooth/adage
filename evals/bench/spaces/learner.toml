# The learner parameter space for `adage eval bench sweep --space evals/bench/spaces/learner.toml`.
# Each dimension overrides one `EngineParams` value (a dotted path) on top of the suite's preset.
# Sobol and Halton map a point in [0, 1)^7 onto these ranges; `grid` tries min, midpoint and max.
name = "learner"
description = "Evidence thresholds of the miners and the runtime's follow window and directive budget"
suite = "core"

[[dims]]
param = "learn.min_support"
kind = "int"
min = 2
max = 8

[[dims]]
param = "learn.green_lower_bound"
kind = "float"
min = 0.4
max = 0.9
step = 0.05

[[dims]]
param = "learn.yellow_rate"
kind = "float"
min = 0.3
max = 0.7
step = 0.05

[[dims]]
# Only an existing route is judged against retain_rate; the offline eval learns into an empty
# home, so this has no effect at L0 (kept to confirm that, and for tiers that re-learn).
param = "learn.retain_rate"
kind = "float"
min = 0.1
max = 0.5
step = 0.05

[[dims]]
param = "runtime.follow_window"
kind = "int"
min = 2
max = 6

[[dims]]
param = "runtime.max_directives_per_session"
kind = "int"
min = 3
max = 12

[[dims]]
# Written as [num, 20]: 0.9 is [18, 20], the same rule as the default [9, 10].
param = "learn.dead_end_consistency"
kind = "fraction"
min = 0.7
max = 1.0
den = 20
step = 0.05
