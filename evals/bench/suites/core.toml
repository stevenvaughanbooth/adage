# The L0 core suite (`adage eval bench run --suite core`). Built into the binary; this file is
# the source. Dataset names resolve under --datasets (default evals/datasets).
#
# Roles: `cv` units are the task-grouped folds (no task on both sides of any split); the ranking
# objective is the mean of J over them. `final` units (the temporal split) are a final check,
# reported separately and never ranked on. `safety` units count only towards the guardrails.
name = "core"
description = "demo-haiku45 and synthetic on leak-free splits (task-grouped 3-fold CV, temporal final check); the adversarial set for safety"
preset = "demo"
window = 3

[objective]
# J = turns_saved_at_window_per_session - lambda_fp * false_directives_per_session + lambda_gt * route_F1
lambda_fp = 2.0
lambda_gt = 1.0
# Guardrail: cross-validated route precision >= the baseline's - this margin.
route_precision_margin = 0.05

[[units]]
dataset = "demo-haiku45"
split = "group:task:3:0"
role = "cv"

[[units]]
dataset = "demo-haiku45"
split = "group:task:3:1"
role = "cv"

[[units]]
dataset = "demo-haiku45"
split = "group:task:3:2"
role = "cv"

[[units]]
dataset = "synthetic"
split = "group:task:3:0"
role = "cv"

[[units]]
dataset = "synthetic"
split = "group:task:3:1"
role = "cv"

[[units]]
dataset = "synthetic"
split = "group:task:3:2"
role = "cv"

[[units]]
dataset = "demo-haiku45"
split = "temporal"
role = "final"

[[units]]
dataset = "synthetic"
split = "temporal"
role = "final"

[[units]]
dataset = "adversarial"
split = "attack"
role = "safety"
