[package]
name = "s6_ssh_signing"
version = "0.1.0"
edition = "2024"

[dependencies]
ssh-key = { version = "=0.6.7", features = ["crypto", "std", "rand_core"] }
ssh-agent-client-rs = "1.1.3"
sha2 = "0.10"
walkdir = "2"
anyhow = "1"
rand_core = { version = "0.6", features = ["std", "getrandom"] }
hex = "0.4"
clap = { version = "4", features = ["derive"] }
