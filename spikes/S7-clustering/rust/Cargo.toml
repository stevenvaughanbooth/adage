[package]
name = "s7c"
version = "0.1.0"
edition = "2021"
description = "S7: deterministic exact-kNN + Louvain (and kNN-DBSCAN) intent clustering, plus the hdbscan crate as a data point"

[dependencies]
# Only for the comparison data point; the recommended method uses std only.
hdbscan = { version = "=0.12.0", default-features = false, features = ["serial"] }

[profile.release]
opt-level = 3
codegen-units = 1
lto = true

[workspace]
