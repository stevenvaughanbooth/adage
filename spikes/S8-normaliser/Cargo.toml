[package]
name = "s8-normaliser"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "normaliser"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
walkdir = "2"
once_cell = "1"

[profile.release]
opt-level = 3
