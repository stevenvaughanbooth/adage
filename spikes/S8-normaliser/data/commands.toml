# Per-command flag grammar and effect classification, as data.
#
# This is the table the S8 brief asks for: "per-command flag grammars as data (a table)".
# It is loaded at normaliser startup (see src/table.rs) rather than compiled in, matching
# Design Spec §8.6: "Classification is data, per command template, the same way the
# normaliser classifies commands today."
#
# Fields:
#   name            - basename of argv[0]
#   effect          - default effect class: observe | verify | regenerate | environment |
#                      author | publish. Unknown commands not in this table default to
#                      "environment" per §8.6.
#   value_flags     - flags that consume the following token as their value (command-specific:
#                      -n is boolean for rg but takes a value for head).
#   mutating_flags  - flags whose presence alone forces effect to "author" (e.g. sed -i).
#   publish_flags   - flags whose presence forces effect to "publish" (e.g. git reset --hard,
#                      curl -X POST).
#   subcommands     - table of first-positional-argument overrides (git status, npm install, ...).
#     each subcommand entry may itself carry effect / value_flags / mutating_flags / publish_flags,
#     and for a few (npm/pnpm/yarn "run") a `pattern_effects` list of (regex-on-next-arg, effect).

[[commands]]
name = "cat"
effect = "observe"
value_flags = []

[[commands]]
name = "nl"
effect = "observe"
value_flags = ["-b", "-w", "-s"]

[[commands]]
name = "head"
effect = "observe"
value_flags = ["-n", "-c"]

[[commands]]
name = "tail"
effect = "observe"
value_flags = ["-n", "-c", "-f"]

[[commands]]
name = "sed"
effect = "observe"
value_flags = ["-e", "-f"]
mutating_flags = ["-i", "-i.bak"]   # -i[SUFFIX] handled specially in code too

[[commands]]
name = "rg"
effect = "observe"
value_flags = ["-e", "-A", "-B", "-C", "-m", "-t", "-T", "-g", "--type", "--max-count", "--glob", "--type-add"]

[[commands]]
name = "grep"
effect = "observe"
value_flags = ["-e", "-A", "-B", "-C", "-m", "-f", "--max-count", "--include", "--exclude"]

[[commands]]
name = "find"
effect = "observe"
value_flags = ["-name", "-iname", "-type", "-path", "-maxdepth", "-mindepth", "-newer", "-size"]
mutating_flags = ["-delete"]

[[commands]]
name = "fd"
effect = "observe"
value_flags = ["-e", "-t", "-d", "--extension", "--type", "--max-depth"]
publish_flags = ["-x", "-X", "--exec", "--exec-batch"]  # fd -x rm ... is a publish-class delete pipeline; conservative

