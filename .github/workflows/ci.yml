# Continuous integration (plan §6.1). Release builds are .github/workflows/release.yml (dist).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-14 }
          - { name: macos-x64, os: macos-15-intel }
          - { name: linux-x64, os: ubuntu-24.04 }
          - { name: linux-arm64, os: ubuntu-24.04-arm }
          - { name: windows-x64, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Node runs the OpenCode plugin test (inside `cargo test`) and the npm launcher test.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test (adage-store, the Windows-ported store, on every platform)
        run: cargo test --locked -p adage-store
      - name: test
        env:
          ADAGE_PROP_TRACE: ${{ runner.temp }}/prop_shell_last.json
        run: cargo test --workspace --locked --no-fail-fast
      - name: last property-test input (if the process crashed)
        if: failure()
        shell: bash
        run: |
          f="${{ runner.temp }}/prop_shell_last.json"
          if [ -f "$f" ]; then echo "bytes: $(wc -c < "$f")"; head -c 4000 "$f"; echo; fi
      - name: OpenCode plugin test ran under node (not skipped)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p adage-cli --test hooks opencode_plugin -- --nocapture 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -5
          if echo "$out" | grep -q "node not found"; then echo "the OpenCode plugin test was skipped"; exit 1; fi
          echo "$out" | grep -q "1 passed"
      - name: npm launcher
        shell: bash
        run: node npm/test/launcher.test.mjs
      - name: Claude Code session-start hook
        if: runner.os != 'Windows'
        run: plugin/test/session-start.test.sh

  # Release targets without a native CI test runner: the static musl builds dist ships for Linux,
  # each built natively (x64, and arm64 on GitHub's arm64 runner) with the distribution's musl-gcc.
  musl:
    name: musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        # musl-tools installs `musl-gcc`; the cc crate finds it for x86_64 by itself, but looks
        # for `aarch64-linux-musl-gcc` on arm64 unless told.
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release -p adage-cli --target ${{ matrix.target }}
      - name: static and runnable
        run: |
          b=target/${{ matrix.target }}/release/adage
          file "$b" | grep -Eq "statically linked|static-pie linked"
          "$b" version

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: structure and versions
        run: node scripts/check-plugin.mjs
      - name: install the Claude Code CLI (validation only; no agent runs)
        run: npm install -g @anthropic-ai/claude-code
      - name: claude plugin validate
        run: |
          claude plugin validate --strict plugin/claude-code
          claude plugin validate --strict .
