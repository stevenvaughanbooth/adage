# Continuous integration (plan §6.1). Release builds are .github/workflows/release.yml (dist).
name: CI

# Kept fast while iterating: pushes and pull requests run fmt, clippy and the Linux x64 tests, plus
# the cheap dco, deny and plugin checks. The full suite (macOS, Windows, Linux arm64, the musl
# builds, NOTICE, the design and site e2e suites, the release-profile startup test) runs weekly and
# on manual dispatch: `gh workflow run CI --ref <branch>`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  # Full debug info filled the Linux runner's disk while linking the workspace's test binaries
  # (ld died with a bus error at 41 MB free). Backtraces still carry file and line.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # Decision D2: every commit in a pull request carries a DCO sign-off (CONTRIBUTING.md).
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: every commit is signed off
        shell: bash
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"; head="${{ github.event.pull_request.head.sha }}"
          missing=0
          for c in $(git rev-list --no-merges "$base..$head"); do
            if ! git show -s --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::commit $(git show -s --format='%h %s' "$c") has no Signed-off-by line (git commit -s)"
              missing=1
            fi
          done
          exit $missing

  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: test (${{ matrix.name }})
    # A hung test fails the job instead of billing hours of runner time.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[{"name":"macos-arm64","os":"macos-14"},{"name":"macos-x64","os":"macos-15-intel"},{"name":"linux-x64","os":"ubuntu-24.04"},{"name":"linux-arm64","os":"ubuntu-24.04-arm"},{"name":"windows-x64","os":"windows-2022"}]' || '[{"name":"linux-x64","os":"ubuntu-24.04"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: free disk space (the workspace's test build outgrows the Linux runner)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          # Pull requests test only the packages they can affect, found from the merge base.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Node runs the OpenCode plugin test (inside `cargo test`) and the npm launcher test.
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: prepare the Linux staging sandbox
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap strace
          # Ubuntu 24.04 restricts user namespaces for newly built executables. Allow only
          # this job's binaries to create their sandbox; keep the system policy enabled.
          # https://documentation.ubuntu.com/release-notes/24.04/#unprivileged-user-namespace-restrictions
          if [ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            cat > "$RUNNER_TEMP/adage-ci-userns" <<EOF
          abi <abi/4.0>,
          profile adage-ci-userns "$GITHUB_WORKSPACE/target/debug/**" flags=(unconfined) {
            userns,
          }
          EOF
            sudo apparmor_parser -r "$RUNNER_TEMP/adage-ci-userns"
          fi
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test (adage-store, the Windows-ported store, on every platform)
        run: cargo test --locked -p adage-store
      # Fast deterministic evidence checks belong on every PR; the long replay gates stay in
      # evals.yml. A change to quality or spend arithmetic must not wait for the weekly run.
      - name: learning experiment evidence contracts
        run: cargo test --locked -p adage-eval --lib --test paired --test experiment --test experiment_sources
      - name: native provider evidence contracts (no API calls)
        run: python3 -m unittest evals/live/test_evidence.py evals/live/test_scenarios.py
      - name: frozen live runner contracts (simulated agents, real validator)
        if: runner.os == 'Linux'
        run: |
          cargo build --locked -p adage-cli
          python3 -m unittest discover -s evals/live -p 'test_*.py'
          python3 evals/live/sandboxes/cardinal/selfcheck.py
          python3 evals/live/sandboxes/pilot/selfcheck.py
      # A pull request tests the packages its changes can affect: those it changed, those whose
      # tests read a changed fixture, and every package that depends on one of them
      # (`cargo xtask affected`, xtask/src/affected.rs). A change outside every package (the
      # lockfile, this workflow, an undeclared directory) tests everything; pushes to main, the
      # weekly run and dispatches always test everything.
      - name: affected packages
        id: affected
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            out=$(cargo xtask affected --base "origin/${{ github.base_ref }}")
          else
            out=all
          fi
          echo "$out"
          if [ "$out" = "all" ]; then
            echo "args=--workspace --exclude adage-eval" >> "$GITHUB_OUTPUT"
          elif [ "$out" = "none" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=$(echo "$out" | { grep -vx adage-eval || true; } | sed 's/^/-p /' | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi
          case "$out" in all|*adage-cli*) echo "cli=true" >> "$GITHUB_OUTPUT";; *) echo "cli=false" >> "$GITHUB_OUTPUT";; esac
      # Always: the layering rules, the affected-path declarations, and the no-spawn scan of every
      # crate's sources. They guard the selection above, and take seconds.
      - name: architecture guards
        run: |
          cargo test --locked -p xtask
          cargo test --locked -p adage-exec --test no_spawn
      - name: completion checks execute in a real sandbox
        if: runner.os == 'Linux'
        env:
          ADAGE_REQUIRE_COMPLETION_STAGING: "1"
        run: cargo test --locked -p adage-exec --lib required_completion -- --nocapture
      # Temporary diagnosis of the repeated actions timeout; the normal suite below remains
      # the required check. Trace only syscall names, paths and timing, never file payloads.
      - name: diagnose Linux action startup
        if: runner.os == 'Linux' && github.event_name == 'pull_request' && github.head_ref == 'codex/plugin-https-install'
        shell: bash
        run: |
          set -euo pipefail
          command -v python3
          python3 -c 'import sys, site; print(sys.executable); print(sys.version); print(site.getsitepackages())'
          time python3 -c 'import pathlib; print("stdlib startup completed")'
          cargo build --locked -p adage-cli -p adage-exec
          cargo test --locked -p adage-cli --test actions --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/actions-build.jsonl"
          actions_test=$(jq -r 'select(.reason == "compiler-artifact" and .target.name == "actions" and .executable != null) | .executable' "$RUNNER_TEMP/actions-build.jsonl")
          test -x "$actions_test"
          baseline_status=0
          "$actions_test" --nocapture > "$RUNNER_TEMP/actions-startup-baseline.log" 2>&1 || baseline_status=$?
          cat "$RUNNER_TEMP/actions-startup-baseline.log"
          trace_status=0
          strace -f -tt -T -s 256 -e trace=%process,unshare,mount,umount2,wait4,waitid,clock_nanosleep,openat,newfstatat \
            -o "$RUNNER_TEMP/actions-startup.strace" "$actions_test" --nocapture || trace_status=$?
          echo "untraced status: $baseline_status; traced status: $trace_status"
          test "$baseline_status" -eq 0
          test "$trace_status" -eq 0
      - name: save Linux action startup diagnosis
        if: always() && runner.os == 'Linux' && github.event_name == 'pull_request' && github.head_ref == 'codex/plugin-https-install'
        uses: actions/upload-artifact@v7
        with:
          name: linux-actions-startup
          path: |
            ${{ runner.temp }}/actions-startup.strace
            ${{ runner.temp }}/actions-startup-baseline.log
          if-no-files-found: warn
      - name: test
        if: steps.affected.outputs.args != ''
        env:
          ADAGE_PROP_TRACE: ${{ runner.temp }}/prop_shell_last.json
        # adage-eval's gates, bench and parity suites take hours in a debug build; they run in
        # evals.yml (weekly and on dispatch).
        run: cargo test ${{ steps.affected.outputs.args }} --locked --no-fail-fast
      - name: last property-test input (if the process crashed)
        if: failure()
        shell: bash
        run: |
          f="${{ runner.temp }}/prop_shell_last.json"
          if [ -f "$f" ]; then echo "bytes: $(wc -c < "$f")"; head -c 4000 "$f"; echo; fi
      - name: OpenCode plugin test ran under node (not skipped)
        if: runner.os != 'Windows' && steps.affected.outputs.cli == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out=$(cargo test --locked -p adage-cli --test hooks opencode_plugin -- --nocapture 2>&1) || { echo "$out"; exit 1; }
          echo "$out" | tail -5
          if echo "$out" | grep -q "node not found"; then echo "the OpenCode plugin test was skipped"; exit 1; fi
          echo "$out" | grep -q "1 passed"
      - name: npm launcher
        shell: bash
        run: |
          node npm/test/stage.test.mjs
          node npm/test/launcher.test.mjs
      # The one plugin's shim links its three binaries (plan A8, onboarding plan O1): build them,
      # whatever was affected.
      - name: Claude Code session-start hook
        if: runner.os != 'Windows'
        run: |
          cargo build --locked -p adage-cli -p adage-exec -p adage-train
          plugin/test/session-start.test.sh
      - name: release plugin startup and real background bootstrap
        if: runner.os != 'Windows' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        # Product latency budgets are checked on the shipped profile. Debug-only spawn
        # instrumentation is deliberately absent: the registered hooks must learn for real.
        run: cargo test --release --locked -p adage-cli --test zero_config_plugin release_plugin_startup -- --nocapture

  # Release targets without a native CI test runner: the static musl builds dist ships for Linux,
  # each built natively (x64, and arm64 on GitHub's arm64 runner) with the distribution's musl-gcc.
  musl:
    name: musl (${{ matrix.target }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        # musl-tools installs `musl-gcc`; the cc crate finds it for x86_64 by itself, but looks
        # for `aarch64-linux-musl-gcc` on arm64 unless told.
        env:
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release -p adage-cli -p adage-exec -p adage-train --target ${{ matrix.target }}
      - name: static and runnable
        run: |
          d=target/${{ matrix.target }}/release
          for b in adage adage-exec adage-train; do
            file "$d/$b" | grep -Eq "statically linked|static-pie linked"
          done
          "$d/adage" version
          "$d/adage-exec" --help >/dev/null
          "$d/adage-train" --help >/dev/null

  # NOTICE lists every third-party crate the shipped binaries link (scripts/notice.sh, which
  # also checks that adage-exec and adage-train link nothing adage does not).
  notice:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-about --features cli
      - name: NOTICE is current
        run: |
          scripts/notice.sh "$RUNNER_TEMP/NOTICE"
          diff -u --strip-trailing-cr NOTICE "$RUNNER_TEMP/NOTICE" || { echo "::error::NOTICE is stale: run scripts/notice.sh and commit it"; exit 1; }

  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: structure and versions
        run: node scripts/check-plugin.mjs
      - name: the structure check refuses a second plugin and an on-PATH description
        run: node scripts/test-check-plugin.mjs
      - name: release staging, three binaries per target, checksum enforcement
        run: node scripts/test-stage-plugin.mjs
      - name: publisher recovery, large manifests and release identity checks
        run: node --test scripts/test-release-publish.mjs
      # The release guard (onboarding plan O2): every version file agrees with Cargo.toml, and
      # release.yml is what the pinned dist generates from dist-workspace.toml plus the one
      # documented SBOM patch. dist is installed at the version dist-workspace.toml pins.
      - uses: dtolnay/rust-toolchain@stable
      - name: install dist
        shell: bash
        run: |
          set -euo pipefail
          v=$(sed -n 's/^cargo-dist-version = "\(.*\)"$/\1/p' dist-workspace.toml)
          test -n "$v"
          curl --proto '=https' --tlsv1.2 -LsSf "https://github.com/axodotdev/cargo-dist/releases/download/v$v/cargo-dist-installer.sh" | sh
      - name: release check
        run: cargo xtask release-check --require-dist
      # Pinned: the mod's API is early access and moves between releases (docs/claude-mod
      # architecture §6 invariant 10); bump it together with plugin/claude-code/VALIDATE.txt.
      - name: install the Claude Code CLI (validation and plugin tests only; no agent runs)
        run: npm install -g @anthropic-ai/claude-code@2.1.288
      - name: claude plugin validate
        run: |
          claude plugin validate --strict plugin/claude-code
          claude plugin validate --strict .
      - name: validate output matches the committed VALIDATE.txt
        run: |
          set -euo pipefail
          # Claude's bullets/checkmark vary by host; keep the manifest/hook/API text exact.
          claude plugin validate --strict plugin/claude-code 2>&1 \
            | sed -e "s#$PWD/##g" -e 's/^  ❯ /  > /' -e 's/^✔ Validation passed$/√ Validation passed/' > /tmp/validate.txt
          diff -u plugin/claude-code/VALIDATE.txt /tmp/validate.txt
      # One plugin carries the mod and the three binaries (plan A8, onboarding plan O1); its
      # session-start shim is exercised by plugin/test/session-start.test.sh.
      - name: claude plugin test
        run: claude plugin test plugin/claude-code

  design:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The design tokens and the embedded web map are generated files: fail when either is stale.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: tokens are current and pass contrast
        run: cargo xtask tokens --check
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/map/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/map/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web/map
      - run: pnpm typecheck
        working-directory: web/map
      - name: unit tests (vitest)
        run: pnpm test
        working-directory: web/map
      - name: embedded map matches web/map
        run: pnpm drift
        working-directory: web/map
      - name: browser for the e2e suite
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web/map
      - name: map e2e and axe (builds and starts the adage binary itself)
        run: pnpm test:e2e
        working-directory: web/map

  site:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # The public website (web/site): types, the build, and Playwright with axe in both themes.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/site/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web/site
      - run: pnpm typecheck
        working-directory: web/site
      - name: registration API contract
        run: pnpm test:api
        working-directory: web/site
      - name: held-out evidence converter
        run: pnpm test:evidence
        working-directory: web/site
      - name: browser for the e2e suite
        run: pnpm exec playwright install --with-deps chromium
        working-directory: web/site
      - name: site e2e and axe (builds and serves the site itself)
        run: pnpm test:e2e
        working-directory: web/site
