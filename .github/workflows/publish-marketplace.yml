# Publishes the Claude Code plugin with its binaries bundled to the `marketplace` branch, which
# `.claude-plugin/marketplace.json` installs from (a `git-subdir` source with `ref: marketplace`).
# Called by release.yml (generated by dist) as the custom publish job "./publish-marketplace",
# after the GitHub Release exists; `plan` is dist's manifest.
#
# The branch holds plugin/claude-code from the tagged commit with dist/<target>/{adage,adage-exec,
# adage-train} for all five release targets (no adage-exec on Windows) and dist/SHA256SUMS
# (onboarding plan O1). Every archive is checked against dist's own .sha256 before it is unpacked,
# every staged binary against SHA256SUMS after, staging fails naming any target that lacks a
# binary, and the runner's own adage (linux x64) is run once. The session-start shim verifies
# SHA256SUMS again on the person's machine, so `/plugin install adage@adage` works with no adage on
# PATH and no download. scripts/test-stage-plugin.mjs runs this job's staging locally in CI.
#
# Each release is one commit on the branch (its history is kept, so an installed version can be
# pinned by `sha`); Claude Code clones the plugin directory sparsely, fetching the tip's files only.
name: Publish marketplace

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      PLAN: ${{ inputs.plan }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Fetch release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true
      - name: Stage the plugin with its three verified binaries
        shell: bash
        run: |
          set -euo pipefail
          version=$(echo "$PLAN" | jq -r '[.releases[] | select(.app_name == "adage-cli") | .app_version][0]')
          test -n "$version" && test "$version" != null
          echo "VERSION=$version" >> "$GITHUB_ENV"
          node scripts/stage-plugin.mjs --artifacts artifacts --out staged
          node scripts/check-plugin.mjs --staged staged
      - name: Commit to the marketplace branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "adage release"
          git config user.email "adage-release@users.noreply.github.com"
          src=$(git rev-parse HEAD)
          if git fetch origin marketplace; then
            git worktree add mkt origin/marketplace
            git -C mkt checkout -B marketplace
          else
            git worktree add --detach mkt
            git -C mkt checkout --orphan marketplace
          fi
          git -C mkt rm -rq --ignore-unmatch . || true
          cp -R staged/. mkt/
          git -C mkt add -A -f .
          git -C mkt commit -q -m "adage $VERSION plugin with bundled binaries (from $src)"
          git -C mkt push origin marketplace
