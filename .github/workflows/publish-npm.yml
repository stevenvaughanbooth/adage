# Publishes the npm packages (npm/) for a release. Called by release.yml (generated by dist) as the
# custom publish job "./publish-npm", after the GitHub Release exists; `plan` is dist's manifest.
#
# Layout (plan §6.2): one package per platform, selected by `os`/`cpu` through the main package's
# optionalDependencies; no postinstall download. Packages are published with --provenance (Sigstore,
# via this job's OIDC token).
#
# Enable with the repository VARIABLE ADAGE_NPM_PUBLISH=true (a same-named secret does not count).
# Prefer npm trusted publishing: configure all six packages for the calling workflow release.yml,
# with direct npm publish allowed. An optional NPM_TOKEN granular token can bootstrap the first
# publish before the packages exist. See docs/release.md. The name is set in npm/config.mjs.
name: Publish npm

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published release tag to recover (for example v0.1.0)
        required: true
        type: string
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    if: ${{ vars.ADAGE_NPM_PUBLISH == 'true' }}
    env:
      # Keep the reusable plan input for cargo-dist compatibility, but never export its large JSON.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
      RELEASE_MODE: ${{ github.event_name == 'workflow_dispatch' && 'recovery' || 'automatic' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Resolve the published release and preserve its validator
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp scripts/release-publish.mjs "$RUNNER_TEMP/release-publish.mjs"
          node "$RUNNER_TEMP/release-publish.mjs" resolve "$RUNNER_TEMP/release-identity.json"
      - name: Check out the exact release source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          persist-credentials: false
      - name: Fetch artifacts from this release run
        if: github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          path: artifacts/
          merge-multiple: true
      - name: Fetch existing public release assets for recovery
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir artifacts \
            --pattern 'adage-*.tar.xz' --pattern 'adage-*.zip' --pattern 'adage-*.sha256' \
            --pattern 'dist-manifest.json'
      - name: Verify release identity and versions from the manifest file
        shell: bash
        run: |
          set -euo pipefail
          manifest=artifacts/plan-dist-manifest.json
          if [ "$RELEASE_MODE" = recovery ]; then manifest=artifacts/dist-manifest.json; fi
          node "$RUNNER_TEMP/release-publish.mjs" validate "$RUNNER_TEMP/release-identity.json" "$manifest"
      - name: Stage packages
        shell: bash
        run: |
          set -euo pipefail
          node npm/scripts/stage.mjs --version "$VERSION" --artifacts artifacts --out npm-out
      - name: Smoke-test the staged linux-x64 package through the launcher
        shell: bash
        run: |
          set -euo pipefail
          name=$(jq -r .name npm-out/cli/package.json)
          mkdir -p "smoke/node_modules/$(dirname "$name")"
          cp -R npm-out/cli "smoke/node_modules/$name"
          cp -R npm-out/linux-x64 "smoke/node_modules/$name-linux-x64"
          test "$(node "smoke/node_modules/$name/bin/adage.js" version)" = "adage $VERSION"
      - name: Inspect package contents before publishing
        shell: bash
        run: |
          set -euo pipefail
          while read -r dir; do
            npm pack "./npm-out/$dir" --dry-run --json --ignore-scripts > "npm-out/$dir-pack.json"
            node npm/scripts/check-tarball.mjs "npm-out/$dir/package.json" "npm-out/$dir-pack.json"
          done < npm-out/publish-order.txt
      - name: Publish (platform packages first, then the main package)
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          while read -r dir; do
            name=$(jq -r .name "npm-out/$dir/package.json")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published; skipping"
              continue
            fi
            npm publish "./npm-out/$dir" --provenance --access public --tag "$tag"
          done < npm-out/publish-order.txt
