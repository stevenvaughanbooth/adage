[package]
name = "adage-graph"
description = "Track G graph engine: value-flow induction and learned value types (G1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Track G §1.3: adage-graph depends on adage-core, adage-intent, adage-tracks and the canonical
# trace model (adage-trace), never on adage-runtime or adage-learn. The runtime never links it.
[dependencies]
adage-core = { path = "../adage-core" }
adage-intent = { path = "../adage-intent" }
adage-trace = { path = "../adage-trace" }
adage-tracks = { path = "../adage-tracks" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
adage-ingest = { path = "../adage-ingest" }
regex.workspace = true
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
