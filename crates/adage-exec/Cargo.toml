[package]
name = "adage-exec"
description = "The executing binary (Track C): approved routes, run in an OS sandbox, returned as typed, fenced data"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "adage-exec"
path = "src/main.rs"

# Released by dist beside adage (its own archive and installers): `adage delegate` runs it. The npm
# platform packages and the Claude Code plugin carry it beside adage (npm/config.mjs). No Homebrew
# formula until Homebrew returns to the release (dist-workspace.toml).
[package.metadata.dist]
dist = true

[dependencies]
adage-core = { path = "../adage-core" }
adage-store = { path = "../adage-store" }
adage-tracks = { path = "../adage-tracks" }
adage-runtime = { path = "../adage-runtime" }
adage-pack = { path = "../adage-pack" }
adage-hook = { path = "../adage-hook" }
# The safety oracle re-checks every block `adage-exec hook` delivers (check_data_block).
adage-safety = { path = "../adage-safety" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
once_cell.workspace = true
anyhow.workspace = true
toml.workspace = true
glob.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Linux sandbox: both pure Rust, so musl static builds keep working (Track C §3.3).
# landlock: MIT OR Apache-2.0. seccompiler: Apache-2.0 OR BSD-3-Clause.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
seccompiler = "0.5"

[dev-dependencies]
tempfile = "3"
adage-learn = { path = "../adage-learn" }
# The workspace test kit (docs/claude-mod/impl/testkit.md): the worlds the unit tests run in, and
# `tests/hooks.rs`, which adage-cli shares with the parity test.
adage-tracks = { path = "../adage-tracks", features = ["testkit"] }

[[test]]
name = "escape"
path = "tests/escape/main.rs"
