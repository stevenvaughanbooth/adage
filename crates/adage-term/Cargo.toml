[package]
name = "adage-term"
description = "Adage's terminal design system: tokens, capabilities, theme, glyphs and the output grammar every command prints through"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# `Theme::tui`: the same roles as ratatui styles, for `adage watch`, `adage ui` and `adage init`.
ratatui = ["dep:ratatui-core"]

[dependencies]
anstyle = "1"
anstream = { version = "0.6", default-features = false, features = ["auto", "wincon"] }
unicode-width = "0.2"
ratatui-core = { version = "0.1", optional = true, default-features = false }

[dev-dependencies]
insta = "1"
