[package]
name = "adage-cli"
description = "The adage binary: hook client, learner, and tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "adage"
path = "src/main.rs"

[dependencies]
adage-core = { path = "../adage-core" }
adage-store = { path = "../adage-store" }
adage-tracks = { path = "../adage-tracks" }
adage-intent = { path = "../adage-intent" }
adage-runtime = { path = "../adage-runtime" }
adage-learn = { path = "../adage-learn" }
adage-sign = { path = "../adage-sign" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
regex.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile = "3"
ssh-key = { version = "=0.6.7", features = ["std", "crypto", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
