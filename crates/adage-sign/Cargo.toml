[package]
name = "adage-sign"
description = "Native sshsig signing of track digests (ssh-agent first, key file fallback) and allowed_signers verification"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ssh-key.workspace = true
zeroize = "1"
anyhow.workspace = true

[dev-dependencies]
ssh-key = { workspace = true, features = ["getrandom"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
interprocess = "2.4.4"
