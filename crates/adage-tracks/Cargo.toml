[package]
name = "adage-tracks"
description = "The track format: routes, slots, contracts, evidence; reading, writing, validating, digesting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
adage-core = { path = "../adage-core" }
adage-trace = { path = "../adage-trace" }
adage-intent = { path = "../adage-intent" }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
regex.workspace = true
sha2.workspace = true
anyhow.workspace = true
glob.workspace = true
# The test kit (`testkit` feature) only: a home's state files and spools, and temporary worlds.
adage-store = { path = "../adage-store", optional = true }
tempfile = { version = "3", optional = true }

[features]
# Builders for routes, tracks and indexes, and a learned home with its session state and spools
# (`src/testkit/`), for any crate's tests: enabled from a `[dev-dependencies]` entry, never by a
# normal dependency (docs/claude-mod/impl/testkit.md).
testkit = ["dep:adage-store", "dep:tempfile"]

[dev-dependencies]
tempfile = "3"
# The kit's own unit tests compile it without the feature (`cfg(test)`).
adage-store = { path = "../adage-store" }
