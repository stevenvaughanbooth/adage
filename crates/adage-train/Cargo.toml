[package]
name = "adage-train"
description = "adage-train: compile a skill (or runbook, Makefile, CI workflow) into staged reflexes by driving your own agent harness, sandboxed, when a person asks"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "adage-train"
path = "src/main.rs"

# An optional tool: not part of the `adage` release archives (yet).
[package.metadata.dist]
dist = false

[dependencies]
adage-core = { path = "../adage-core" }
adage-tracks = { path = "../adage-tracks" }
adage-learn = { path = "../adage-learn" }
adage-instincts = { path = "../adage-instincts" }
adage-store = { path = "../adage-store" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
regex.workspace = true
once_cell.workspace = true
sha2.workspace = true
glob.workspace = true

[dev-dependencies]
tempfile = "3"
