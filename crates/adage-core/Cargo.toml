[package]
name = "adage-core"
description = "Canonical actions, the shell normaliser, effect classes, spans, and repository identity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
once_cell.workspace = true
sha2.workspace = true
tree-sitter.workspace = true
tree-sitter-bash.workspace = true
# Inflates git objects, to find a repository's root commit without running git (repository keys).
# Pure Rust; MIT OR Zlib OR Apache-2.0.
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[dev-dependencies]
tempfile = "3"
