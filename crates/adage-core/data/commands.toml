effect = "environment"
[[commands.subcommands]]
name = "add"
effect = "environment"
[[commands.subcommands]]
name = "remove"
effect = "environment"
[[commands.subcommands]]
name = "venv"
effect = "environment"
[[commands.subcommands]]
name = "pip"
effect = "environment"
pattern_effects = [["^(list|show|freeze|tree|check)$", "observe"]]
[[commands.subcommands]]
name = "tool"
effect = "environment"
[[commands.subcommands]]
name = "python"
effect = "environment"
[[commands.subcommands]]
