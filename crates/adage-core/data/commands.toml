# --- Python project and environment managers -------------------------------------------------
# `uv run X`, `poetry run X`, `pdm run X`, `hatch run X`, `pipenv run X`, `uvx X` wrap a program
# (`wraps`): they classify as X when the table knows X, else as the subcommand's own effect.
# Syncing or installing an environment is environment; tox and nox run a project's declared test
# environments and are verify.

[[commands]]
name = "uv"
effect = "environment"
value_flags = ["--directory", "--project", "--cache-dir", "--config-file"]
[[commands.subcommands]]
name = "run"
effect = "environment"
wraps = true
value_flags = [
  "--with", "--with-requirements", "--with-editable", "--group", "--only-group", "--no-group",
  "--extra", "--package", "-p", "--python", "--directory", "--project", "--env-file", "--index",
  "--default-index", "--index-url", "--extra-index-url", "-C", "--config-setting", "--cache-dir",
]
