# Anthropic API list prices, US dollars per million tokens, used to price agent traces for
# Adage's savings estimate (docs/zero-config.md §4.1). Every figure Adage shows from this table is
# labelled "API-list equivalent": subscription users do not pay per token.
#
# `as_of` is the date these list prices were read (Anthropic's model and pricing pages; the
# claude-api reference cached on that date). A model not listed here is shown as tokens and turns
# only, never priced by guess. `prefix` matches the transcript's model id with or without a date
# suffix (`claude-haiku-4-5-20251001` matches `claude-haiku-4-5`); the longest matching prefix wins.
#
# Cache writes use the 5-minute TTL rate (1.25x input), the TTL Claude Code writes by default;
# cache reads are the per-model read rate (0.1x input on most models).
#
# Codex sessions (OpenAI models) are not priced here: they are shown as tokens and turns only.
# OpenCode exports carry the harness's own cost, which is used as reported.

as_of = "2026-06-24"
source = "Anthropic API list prices (anthropic.com/pricing)"

[[model]]
prefix = "claude-fable-5-1"
input = 10.0
output = 50.0
cache_write = 12.5
cache_read = 0.25

