[package]
name = "adage-pack"
description = "Track packs (format adage-pack/1): compiled skills as signed, content-addressed, closed artifacts"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "adage-pack"
path = "src/main.rs"

[dependencies]
adage-core = { path = "../adage-core" }
adage-tracks = { path = "../adage-tracks" }
adage-sign = { path = "../adage-sign" }
adage-instincts = { path = "../adage-instincts" }
adage-intent = { path = "../adage-intent" }
glob.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
regex.workspace = true
regex-syntax = "0.8"
sha2.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile = "3"
proptest = { version = "1", default-features = false, features = ["std"] }
ssh-key = { version = "=0.6.7", features = ["std", "crypto", "rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
