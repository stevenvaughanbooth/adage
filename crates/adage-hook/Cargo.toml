[package]
name = "adage-hook"
description = "The hook pipeline shared by `adage hook` and `adage-exec hook`: harness adapters, fast path, state, decide, spool, render"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
adage-core = { path = "../adage-core" }
adage-trace = { path = "../adage-trace" }
adage-store = { path = "../adage-store" }
adage-tracks = { path = "../adage-tracks" }
adage-intent = { path = "../adage-intent" }
adage-world = { path = "../adage-world" }
adage-runtime = { path = "../adage-runtime" }
adage-ingest = { path = "../adage-ingest" }
adage-pack = { path = "../adage-pack" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The press token (src/press.rs): 32 bytes from the operating system. Already in the tree
# through adage-sign.
getrandom = "0.2"

[dev-dependencies]
insta = "1"
tempfile = "3"
# The workspace test kit (docs/claude-mod/impl/testkit.md): the worlds the unit tests run in.
adage-tracks = { path = "../adage-tracks", features = ["testkit"] }
