<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Adage README header</title>
<style>
@font-face { font-family: "Bricolage Grotesque"; font-weight: 200 800; src: url("../../../web/site/node_modules/@fontsource-variable/bricolage-grotesque/files/bricolage-grotesque-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Hanken Grotesk"; font-weight: 100 900; src: url("../../../web/site/node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2") format("woff2"); }
@font-face { font-family: "Red Hat Mono"; font-weight: 300 700; src: url("../../../web/site/node_modules/@fontsource-variable/red-hat-mono/files/red-hat-mono-latin-wght-normal.woff2") format("woff2"); }
:root { --ink: #f4f4f7; --ink3: #b4b7c4; --ink4: #7a7d8c; --accent2: #c9bfff; --sans: "Hanken Grotesk", sans-serif; --serif: "Bricolage Grotesque", sans-serif; --mono: "Red Hat Mono", monospace; }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
body { background: #050507 url("background.jpg") center / 1200px 630px no-repeat; color: var(--ink); font-family: var(--sans); }
/* The original 1920×1080 end card, scaled and cropped to the README's 1200×630. */
.stage { position: absolute; top: -22.5px; left: 0; width: 1920px; height: 1080px; transform: scale(.625); transform-origin: 0 0; }
.wordmark { position: absolute; top: 250px; left: 0; right: 0; text-align: center; font-family: var(--serif); font-weight: 700; font-size: 250px; line-height: 1; letter-spacing: -.04em; white-space: nowrap; }
.wordmark b { display: inline-block; font-weight: 400; background: linear-gradient(180deg, #fff 15%, #c9bfff 100%); background-clip: text; -webkit-background-clip: text; color: transparent; }
.acronym { position: absolute; top: 540px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 24px; font-weight: 500; letter-spacing: .32em; text-transform: uppercase; color: var(--ink3); }
.lamps { position: absolute; top: 626px; left: 0; right: 0; display: flex; justify-content: center; gap: 28px; }
.lamps i { width: 28px; height: 28px; border-radius: 50%; display: block; }
.lamps i:nth-child(1) { background: #4ade80; box-shadow: 0 0 25.3px 3.4px #4ade80; }
.lamps i:nth-child(2) { background: #fbbf24; box-shadow: 0 0 19.9px 2.7px #fbbf24; }
.lamps i:nth-child(3) { background: #fb7185; box-shadow: 0 0 12.3px 1.6px #fb7185; }
.tagline { position: absolute; top: 700px; left: 0; right: 0; display: flex; justify-content: center; column-gap: .26em; font-family: var(--serif); font-size: 64px; font-weight: 650; line-height: 1; letter-spacing: -.03em; text-shadow: 0 0 40px rgba(139,124,255,.16); }
.tagline em { font-style: normal; color: var(--accent2); }
.install { position: absolute; top: 850px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 32px; white-space: nowrap; }
.install .punctuation { color: var(--ink4); }
.facts { position: absolute; top: 950px; left: 0; right: 0; text-align: center; font-family: var(--mono); font-size: 22px; color: var(--ink4); letter-spacing: .04em; }
</style>
</head>
<body>
<div class="stage">
  <div class="wordmark" aria-label="Adage"><b>A</b><b>d</b><b>a</b><b>g</b><b>e</b></div>
  <div class="acronym">Agentic DAG Engine</div>
  <div class="lamps" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="tagline"><span>Agent</span><span>traces</span><span>become</span><em>reflexes.</em></div>
  <div class="install"><span class="punctuation">$ </span>npm install -g @adage-sh/cli <span class="punctuation">&amp;&amp;</span> adage init</div>
  <div class="facts">Apache-2.0 · prebuilt binaries · Claude Code, OpenCode, Codex · deterministic, fail-open</div>
</div>
</body>
</html>
