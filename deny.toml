# cargo-deny: licenses, advisories, bans and sources, enforced in CI (plan §6.1, §7 L2).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependency graph of every release target, not just the host.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Add RUSTSEC ids here only with a reason, and revisit each one at every release.
ignore = [
  # rsa (Marvin timing side channel; no fixed release exists), via ssh-key's "crypto" feature in
  # adage-sign. Adage signs track digests locally, once, from a key file or ssh-agent, and
  # verifies with public keys only: no attacker can time private-key operations over a network,
  # which is the advisory's own stated safe case. Revisit when rsa ships a constant-time release.
  { id = "RUSTSEC-2023-0071", reason = "local, one-shot RSA signing only; no network-observable timing" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only; no copyleft. Every entry is used by the current dependency tree, and
# `unused-allowed-license` warns when one stops being needed.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]
unused-allowed-license = "warn"

[licenses.private]
# Adage's own crates say `license = "UNLICENSED"` until the license is chosen (TODO(D1)); they
# are not published, so they are not license-checked here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
