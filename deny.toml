# cargo-deny: licenses, advisories, bans and sources, enforced in CI (plan §6.1, §7 L2).
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check the dependency graph of every release target, not just the host.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# Add RUSTSEC ids here only with a reason, and revisit each one at every release.
ignore = [
  # rsa (Marvin timing side channel; no fixed release exists), via ssh-key's "crypto" feature in
  # adage-sign. Adage signs track digests locally, once, from a key file or ssh-agent, and
  # verifies with public keys only: no attacker can time private-key operations over a network,
  # which is the advisory's own stated safe case. Revisit when rsa ships a constant-time release.
  { id = "RUSTSEC-2023-0071", reason = "local, one-shot RSA signing only; no network-observable timing" },
  # crypto-bigint 0.5 (secret-dependent branches in operations meant to be constant-time), via
  # p256/p384/p521 under ssh-key's "crypto" feature in adage-sign: the same local, one-shot ECDSA
  # signing and public-key-only verification as above, with no network-observable timing. The fix
  # is crypto-bigint 0.7.6, which only ssh-key 0.7 (a release candidate) would bring, and
  # ssh-agent-client-rs still requires ssh-key 0.6. Revisit when ssh-key 0.7 and an
  # ssh-agent-client-rs built on it are released.
  { id = "RUSTSEC-2026-0387", reason = "local, one-shot ECDSA signing only; no network-observable timing; no fixed stable ssh-key yet" },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Permissive licenses only; no copyleft. Every entry is used by the current dependency tree, and
# `unused-allowed-license` warns when one stops being needed.
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  # foldhash (hashbrown's default hasher), which ratatui's layout solver (kasuari) requires for
  # the terminal UI. Zlib is permissive, like MIT: no copyleft, attribution only.
  "Zlib",
]
unused-allowed-license = "warn"

[licenses.private]
# Adage's own crates (Apache-2.0) are not published to crates.io, so they are not license-checked
# as dependencies here.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
