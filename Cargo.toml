[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# TODO(D1): the license is not chosen yet. Until it is, no crate may be published to crates.io
# (publish = false), and cargo-deny skips these unpublished crates' own license.
license = "UNLICENSED"
publish = false
repository = "https://github.com/stevenvaughanbooth/adage"
homepage = "https://github.com/stevenvaughanbooth/adage"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
once_cell = "1"
sha2 = "0.10"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
anyhow = "1"
glob = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Release artifacts (dist builds with this profile; see dist-workspace.toml).
[profile.dist]
inherits = "release"
