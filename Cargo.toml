[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# Apache-2.0 (decision D1; LICENSE, NOTICE). Releases ship through GitHub Releases, npm and
# Homebrew; the crates are not published to crates.io yet (publish = false), so an accidental
# `cargo publish` cannot happen. Flip this when crates.io publishing is wanted.
license = "Apache-2.0"
publish = false
repository = "https://github.com/stevenvaughanbooth/adage"
homepage = "https://github.com/stevenvaughanbooth/adage"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
serde_yaml = "0.9"
toml = "0.8"
regex = "1"
once_cell = "1"
sha2 = "0.10"
walkdir = "2"
tree-sitter = "0.24"
tree-sitter-bash = "0.23"
anyhow = "1"
glob = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"

# Release artifacts (dist builds with this profile; see dist-workspace.toml).
[profile.dist]
inherits = "release"
